name: Deploy to Azure Functions

on:
  # Manual trigger from GitHub Actions UI
  workflow_dispatch:

  # Trigger on push to main branch
  push:
    branches:
      - main
    paths:
      - 'lss_invoice_automation.py'
      - 'invoice_parser.py'
      - 'excel_generator.py'
      - 'graph_client.py'
      - 'config.py'
      - 'requirements.txt'
      - 'function_app.py'
      - '.github/workflows/azure-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Azure Functions Core Tools
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > microsoft.gpg
          sudo mv microsoft.gpg /etc/apt/trusted.gpg.d/microsoft.gpg
          sudo sh -c 'echo "deb [arch=amd64 signed-by=/etc/apt/trusted.gpg.d/microsoft.gpg] https://packages.microsoft.com/repos/azure-cli/ focal main" > /etc/apt/sources.list.d/azure-cli.list'
          sudo apt-get update
          sudo apt-get install -y azure-functions-core-tools-4

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install azure-functions

      - name: Test the app
        run: |
          python -m pytest tests/ || true

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Functions
        run: |
          func azure functionapp publish ${{ secrets.AZURE_FUNCTION_APP }} --build remote

      - name: Configure function app settings
        run: |
          az functionapp config appsettings set \
            --name ${{ secrets.AZURE_FUNCTION_APP }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --settings \
              AZURE_TENANT_ID="${{ secrets.AZURE_TENANT_ID }}" \
              AZURE_CLIENT_ID="${{ secrets.AZURE_CLIENT_ID }}" \
              AZURE_CLIENT_SECRET="${{ secrets.AZURE_CLIENT_SECRET }}" \
              USER_EMAIL="${{ secrets.USER_EMAIL }}" \
              OUTPUT_EMAIL="${{ secrets.OUTPUT_EMAIL }}" \
              MASTER_TRACKER_ONEDRIVE_PATH="${{ secrets.MASTER_TRACKER_ONEDRIVE_PATH }}"

      - name: Run health check
        run: |
          sleep 5
          FUNCTION_URL="https://${{ secrets.AZURE_FUNCTION_APP }}.azurewebsites.net/api/health"
          curl -X GET $FUNCTION_URL

      - name: Deployment summary
        run: |
          echo "✅ Deployment completed successfully!"
          echo ""
          echo "Function App: ${{ secrets.AZURE_FUNCTION_APP }}"
          echo "Resource Group: ${{ secrets.AZURE_RESOURCE_GROUP }}"
          echo ""
          echo "Schedule: 9 AM EST, weekdays (0 14 * * 1-5)"
          echo "Manual trigger: POST /api/run-lss-automation"
          echo "Health check: GET /api/health"
